name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run typecheck lint test
      # Fails if the dev sign-in shortcut or test password reached a release bundle.
      - run: pnpm --filter @riffit/mobile check:release
      # Fails if the test users changed without regenerating the seed.
      - run: pnpm db:gen-seed
      - run: git diff --exit-code supabase/seed.sql

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only Postgres is needed for pgTAP; this applies migrations and the seed.
      - run: pnpm supabase db start
      - run: pnpm test:db
      # Fails if a migration changed without regenerating the types.
      - run: pnpm db:types
      - run: git diff --exit-code packages/supabase/src/database.types.ts
