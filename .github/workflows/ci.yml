name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run typecheck lint test
      # Edge Functions run on Deno, outside the Turbo packages.
      - run: pnpm check:functions
      - run: pnpm test:functions
      # Fails if the dev sign-in shortcut or test password reached a release bundle.
      - run: pnpm --filter @riffit/mobile check:release

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pgTAP only needs Postgres. The Edge Function integration tests also need Auth, Storage,
      # PostgREST, and the API gateway. Applies migrations and the seed.
      - run: pnpm supabase start -x studio,imgproxy,realtime,mailpit,logflare,vector,supavisor
      - run: pnpm test:db
      # Fails if a migration changed without regenerating the types.
      - run: pnpm db:types
      - run: git diff --exit-code packages/supabase/src/database.types.ts
      - name: Serve Edge Functions
        run: |
          pnpm supabase functions serve > functions.log 2>&1 &
          # Ready once the function itself answers: unauthenticated POSTs get a 401.
          timeout 120 bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            http://127.0.0.1:54321/functions/v1/process-image)" = 401 ]; do sleep 2; done'
      - run: pnpm test:functions:integration
      - name: Edge Function logs
        if: failure()
        run: cat functions.log
