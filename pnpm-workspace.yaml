packages:
  - apps/*
  - packages/*

# What create-expo-app generates for pnpm. Expo warns that some React Native libraries fail with
# pnpm's default isolated layout.
nodeLinker: hoisted

# Install scripts that may run. The Supabase CLI package downloads its binary in one, and Deno's
# links the binary for this platform.
allowBuilds:
  deno: true
  supabase: true
